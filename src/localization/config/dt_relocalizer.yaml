# DT 三点 + 双墙平面定位与偏离检测 —— 完整配置。
# 本文件是配置的唯一权威来源（README 的参数说明以本文件为准）。
#
# 单位约定：长度 / 坐标 / 距离 / 噪声一律 m；角度一律 rad；比例因子无量纲。
localization_node:
  ros__parameters:
    # ================= 数据源 =================
    distance_topic: "/get_serial_msg/distances"  # 订阅的 Dt35Distances 话题（原始毫米值）
    channel_indices: [0, 1, 2]   # 使用的 3 个通道下标（0 起始），第 j 个下标对应 dt{j+1}
    frame_id: "map"              # 结果 / 位姿消息的 frame_id（墙平面所在世界系）

    # ================= 采样 =================
    sample_duration: 3.0   # 静止采样时长（s），期间车体必须保持不动
    min_samples: 50        # 每通道剔异常后的最少样本数，不足则不求解（NOT_ENOUGH_SAMPLES）

    # ================= 先验 q0 / P0 =================
    q0_x: 0.0          # 先验 x（m）
    q0_y: 0.0          # 先验 y（m）
    q0_psi: 0.0        # 先验 psi（rad）
    sigma_x0: 0.5      # 先验 x 标准差（m），P0 对角线取平方
    sigma_y0: 0.5      # 先验 y 标准差（m）
    sigma_psi0: 0.35   # 先验 psi 标准差（rad）

    # ================= Gauss-Newton 与判定阈值 =================
    gn_max_iter: 20           # 最大迭代次数
    gn_step_tol: 1.0e-8       # ||dq|| 收敛阈值
    gn_diff_eps: 1.0e-6       # 数值雅可比中心差分步长
    denom_min_abs: 1.0e-6     # |n^T w| 下限，过小判该路测量无效并剔除
    yaw_max: 1.0              # |psi_hat| 超过该值视为求解失败（rad）
    cond_warn_threshold: 1000.0     # 信息矩阵 A 条件数告警阈值（LOW_OBSERVABILITY）
    mahalanobis_threshold: 11.34    # 马氏距离阈值（chi2(3, 0.99)，DEVIATED）

    # ================= 传感器标定（dt1 / dt2 / dt3） =================
    # 每组的含义：
    #   s        : 安装点 [a, b, h]^T，车体系（m），h 为离地高度
    #   u        : 光轴单位向量，车体系（代码会自动归一化）
    #   n        : 墙平面单位法线，世界系（代码会自动归一化）
    #   c        : 墙平面方程 n^T X = c（m）
    #   b        : 距离偏置（m）
    #   k        : 距离比例因子
    #   sigma_d  : 测量噪声标准差（m）
    #   sigma_sys: 系统误差地板（m），合成噪声 sigma^2 = sigma_d^2 + sigma_sys^2
    #
    # 注意：下面是演示用几何（三传感器、两墙，d1=d2=2.0、d3=1.5 对应 q=[0,0,0]），
    # TODO：按实际安装位置与墙平面重新标定后替换。
    dt1:
      s: [0.0, 0.15, 0.25]
      u: [1.0, 0.0, 0.0]
      n: [1.0, 0.0, 0.0]
      c: 2.0
      b: 0.0
      k: 1.0
      sigma_d: 0.01
      sigma_sys: 0.02
    dt2:
      s: [0.0, -0.15, 0.25]
      u: [1.0, 0.0, 0.0]
      n: [1.0, 0.0, 0.0]
      c: 2.0
      b: 0.0
      k: 1.0
      sigma_d: 0.01
      sigma_sys: 0.02
    dt3:
      s: [0.0, 0.0, 0.25]
      u: [0.0, 1.0, 0.0]
      n: [0.0, 1.0, 0.0]
      c: 1.5
      b: 0.0
      k: 1.0
      sigma_d: 0.01
      sigma_sys: 0.02
